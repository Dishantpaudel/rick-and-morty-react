name: React CI Pipeline

# This tells GitHub to run this workflow every time you push to the main branch
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest # This is the virtual computer GitHub will use

    steps:
      # Step 1: Get the code from your repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: Install all your dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run your Code Police (ESLint)
      - name: Run Linting
        run: npm run lint

      # Step 5: Run your Vitest tests
      - name: Run Tests
        run: npm run test

      # Step 6: Make sure the app actually builds successfully
      - name: Build Application
        run: npm run build